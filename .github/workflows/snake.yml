name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Sameer4445
          outputs: |
            dist/snake-dark.svg?color_snake=%23A78BFA&color_dots=%232d3343,%233b3f51,%236d28d9,%238b5cf6,%23A78BFA
            dist/snake-light.svg?color_snake=%237C3AED&color_dots=%23ebedf0,%23c4b5fd,%23a78bfa,%238b5cf6,%237C3AED

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
